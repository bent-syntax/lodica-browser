[package]
name = "lodica-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
scrypt = { version = "0.11", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
