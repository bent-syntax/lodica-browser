<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" font-family="Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
<filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
<marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11z" fill="#f59e0b"/></marker>
</defs>
<rect width="900" height="310" rx="20" fill="url(#bg)"/>
<text x="450" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Optional: connect a relay</text>
<text x="450" y="78" text-anchor="middle" font-size="14" fill="#94a3b8">Hidden email, tab sharing, server chat, notifications</text>
<rect x="410" y="90" width="80" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="40" y="120" width="240" height="120" rx="14" fill="#1e293b" stroke="#334155" filter="url(#sh)"/>
<text x="60" y="155" font-size="17" font-weight="700" fill="#f8fafc">Lodica app</text>
<text x="60" y="186" font-size="13" font-family="monospace" fill="#cbd5e1">Android and desktop</text>
<text x="60" y="210" font-size="13" font-family="monospace" fill="#cbd5e1">one token for both</text>
<rect x="330" y="120" width="240" height="120" rx="14" fill="#1e293b" stroke="#334155" filter="url(#sh)"/>
<text x="350" y="155" font-size="17" font-weight="700" fill="#f8fafc">Your relay (HTTPS)</text>
<text x="350" y="186" font-size="13" font-family="monospace" fill="#cbd5e1">Mail, search, tabs</text>
<text x="350" y="210" font-size="13" font-family="monospace" fill="#cbd5e1">Chat, groups, updates</text>
<rect x="620" y="120" width="240" height="120" rx="14" fill="#1e293b" stroke="#334155" filter="url(#sh)"/>
<text x="640" y="155" font-size="17" font-weight="700" fill="#f8fafc">Your VPS</text>
<text x="640" y="186" font-size="13" font-family="monospace" fill="#cbd5e1">Debian or Ubuntu</text>
<text x="640" y="210" font-size="13" font-family="monospace" fill="#cbd5e1">wildcard DNS record</text>
<path d="M284 180H326" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<path d="M574 180H616" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="450" y="280" text-anchor="middle" font-size="14" fill="#94a3b8">Everything works without a relay. The setup wizard links one by domain and token.</text>
</svg>
