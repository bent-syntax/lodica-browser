<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-label="Lodica feature overview">
  <rect width="1180" height="360" rx="20" fill="#17181B"/>
  <g transform="translate(20 20)">
    <rect width="270" height="150" rx="20" fill="#202226"/>
    <rect x="20" y="20" width="44" height="44" rx="12" fill="#33363C"/>
    <g transform="translate(30 30)" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 4v16"/></g>
    <text x="20" y="96" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#ECEDEE">Vertical tabs</text>
    <text x="20" y="118" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">Restored after restart,</text>
    <text x="20" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">undo closed tabs</text>
  </g>
  <g transform="translate(310 20)">
    <rect width="270" height="150" rx="20" fill="#202226"/>
    <rect x="20" y="20" width="44" height="44" rx="12" fill="#33363C"/>
    <g transform="translate(30 30)" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></g>
    <text x="20" y="96" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#ECEDEE">Ad blocking</text>
    <text x="20" y="118" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">uBlock Origin and</text>
    <text x="20" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">cookie-banner rejection</text>
  </g>
  <g transform="translate(600 20)">
    <rect width="270" height="150" rx="20" fill="#202226"/>
    <rect x="20" y="20" width="44" height="44" rx="12" fill="#33363C"/>
    <g transform="translate(30 30)" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></g>
    <text x="20" y="96" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#ECEDEE">Password vault</text>
    <text x="20" y="118" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">PIN-locked, per-site</text>
    <text x="20" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">dummy email aliases</text>
  </g>
  <g transform="translate(890 20)">
    <rect width="270" height="150" rx="20" fill="#202226"/>
    <rect x="20" y="20" width="44" height="44" rx="12" fill="#33363C"/>
    <g transform="translate(30 30)" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></g>
    <text x="20" y="96" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#ECEDEE">Built-in PDF viewer</text>
    <text x="20" y="118" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">Also opens Word and</text>
    <text x="20" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">SVG documents</text>
  </g>
  <g transform="translate(20 190)">
    <rect width="270" height="150" rx="20" fill="#202226"/>
    <rect x="20" y="20" width="44" height="44" rx="12" fill="#33363C"/>
    <g transform="translate(30 30)" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></g>
    <text x="20" y="96" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#ECEDEE">Lodica Search</text>
    <text x="20" y="118" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">Own results page,</text>
    <text x="20" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">optional AI answers</text>
  </g>
  <g transform="translate(310 190)">
    <rect width="270" height="150" rx="20" fill="#202226"/>
    <rect x="20" y="20" width="44" height="44" rx="12" fill="#33363C"/>
    <g transform="translate(30 30)" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></g>
    <text x="20" y="96" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#ECEDEE">Planner and notes</text>
    <text x="20" y="118" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">Free windows on</text>
    <text x="20" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">the start page</text>
  </g>
  <g transform="translate(600 190)">
    <rect width="270" height="150" rx="20" fill="#202226"/>
    <rect x="20" y="20" width="44" height="44" rx="12" fill="#33363C"/>
    <g transform="translate(30 30)" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></g>
    <text x="20" y="96" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#ECEDEE">Themes</text>
    <text x="20" y="118" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">Dark, light, custom</text>
    <text x="20" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">and theme plugins</text>
  </g>
  <g transform="translate(890 190)">
    <rect width="270" height="150" rx="20" fill="#202226"/>
    <rect x="20" y="20" width="44" height="44" rx="12" fill="#33363C"/>
    <g transform="translate(30 30)" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g>
    <text x="20" y="96" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#ECEDEE">Gestures and keys</text>
    <text x="20" y="118" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">Editable keybinds,</text>
    <text x="20" y="136" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#A0A4AB">touchpad swipe back</text>
  </g>
</svg>
