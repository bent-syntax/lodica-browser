<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
<filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
<marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11z" fill="#f59e0b"/></marker>
</defs>
<rect width="900" height="330" rx="20" fill="url(#bg)"/>
<text x="450" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Desktop build</text>
<text x="450" y="78" text-anchor="middle" font-size="14" fill="#94a3b8">Node.js 20 or newer</text>
<rect x="410" y="90" width="80" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="40" y="110" width="820" height="190" rx="14" fill="#1e293b" stroke="#334155" filter="url(#sh)"/>
<text x="60" y="145" font-size="17" font-weight="700" fill="#f8fafc">Build the desktop app</text>
<text x="60" y="176" font-size="13" font-family="monospace" fill="#cbd5e1">cd lodica-browser/desktop</text>
<text x="60" y="200" font-size="13" font-family="monospace" fill="#cbd5e1">npm ci</text>
<text x="60" y="224" font-size="13" font-family="monospace" fill="#cbd5e1">npm start</text>
<text x="60" y="248" font-size="13" font-family="monospace" fill="#cbd5e1">npm run dist / dist:linux</text>
<text x="60" y="272" font-size="13" font-family="monospace" fill="#cbd5e1">installers appear in desktop/dist/</text>
</svg>
