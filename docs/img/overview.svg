<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" font-family="Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
<filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
<marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11z" fill="#f59e0b"/></marker>
</defs>
<rect width="900" height="270" rx="20" fill="url(#bg)"/>
<text x="450" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Lodica in three steps</text>
<text x="450" y="78" text-anchor="middle" font-size="14" fill="#94a3b8">Private browser for Android and desktop</text>
<rect x="410" y="90" width="80" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="40" y="120" width="240" height="110" rx="14" fill="#1e293b" stroke="#334155" filter="url(#sh)"/>
<circle cx="68" cy="150" r="14" fill="url(#acc)"/><text x="68" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">1</text>
<text x="92" y="155" font-size="17" font-weight="700" fill="#f8fafc">Get the code</text>
<text x="60" y="186" font-size="13" font-family="monospace" fill="#cbd5e1">git clone the repo</text>
<text x="60" y="210" font-size="13" font-family="monospace" fill="#cbd5e1">cd lodica-browser</text>
<rect x="330" y="120" width="240" height="110" rx="14" fill="#1e293b" stroke="#334155" filter="url(#sh)"/>
<circle cx="358" cy="150" r="14" fill="url(#acc)"/><text x="358" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">2</text>
<text x="382" y="155" font-size="17" font-weight="700" fill="#f8fafc">Build or install</text>
<text x="350" y="186" font-size="13" font-family="monospace" fill="#cbd5e1">Android: gradlew</text>
<text x="350" y="210" font-size="13" font-family="monospace" fill="#cbd5e1">Desktop: npm ci</text>
<rect x="620" y="120" width="240" height="110" rx="14" fill="#1e293b" stroke="#334155" filter="url(#sh)"/>
<circle cx="648" cy="150" r="14" fill="url(#acc)"/><text x="648" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">3</text>
<text x="672" y="155" font-size="17" font-weight="700" fill="#f8fafc">Open and browse</text>
<text x="640" y="186" font-size="13" font-family="monospace" fill="#cbd5e1">Search, quick sites</text>
<text x="640" y="210" font-size="13" font-family="monospace" fill="#cbd5e1">Chat, widgets, sync</text>
<path d="M284 175H326" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
<path d="M574 175H616" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/>
</svg>
