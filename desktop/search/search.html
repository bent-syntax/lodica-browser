<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Lodica Search</title>
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="search.css">
<script src="bgs.js"></script>
<script src="customtheme.js"></script>
<script src="look.js"></script>
</head>
<body>
<header>
  <a class="brand" href="search.html" aria-label="Lodica Search">
    <svg class="mark" viewBox="20 8 70 90" aria-hidden="true">
      <path d="M28 8H40Q44 8 46.5 12L49 16 46.5 20Q44 24 40 24H28A8 8 0 0 1 28 8Z" fill="currentColor"/>
      <rect x="20" y="32" width="28" height="16" rx="8" fill="currentColor"/>
      <rect x="20" y="56" width="32" height="16" rx="8" style="fill:var(--amber)"/>
      <rect x="20" y="80" width="42" height="16" rx="8" fill="currentColor"/>
      <path d="M77 68.5C84.5 68.5 89 79 89 86.5C89 92.5 84 96 77 96C70 96 65 92.5 65 86.5C65 79 69.5 68.5 77 68.5Z" fill="currentColor"/>
    </svg><span>odica</span>
  </a>
  <div id="fw"><form id="f" role="search">
    <input id="q" name="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search the web" enterkeyhint="search">
    <button type="button" id="clr" aria-label="Clear" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4Z" fill="currentColor"/></svg></button>
    <button type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.6 10.8l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z" fill="currentColor"/></svg>
    </button>
  </form><div id="sg" hidden></div></div>
  <nav id="tabs">
    <a data-c="" href="#">All</a>
    <a data-c="images" href="#">Images</a>
  </nav>
</header>
<main id="main">
  <section id="ai" hidden>
    <div class="ai-head"><span class="spark">✦</span> AI answer <span class="ai-note">on this PC</span></div>
    <div id="ai-body"></div>
    <div id="ai-thread"></div>
    <form id="ai-follow" hidden autocomplete="off"><input id="ai-q" type="text" placeholder="Ask a follow-up…" maxlength="1000" enterkeyhint="send"><button id="ai-send" type="submit">Ask</button></form>
  </section>
  <div id="top"></div>
  <div id="plan"></div>
  <div id="notes"></div>
  <div id="note"></div>
  <div id="results"></div>
  <nav id="pages"></nav>
</main>
<script src="search.js"></script>
</body>
</html>
