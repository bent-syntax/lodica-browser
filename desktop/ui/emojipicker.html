<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root { color-scheme: dark light; --bg: #111827; --surface: #1F2937; --text: #E5E7EB; --muted: #9CA3AF; --accent: #F59E0B; }
  @media (prefers-color-scheme: light) { :root { --bg: #FFFFFF; --surface: #F3F4F6; --text: #111827; --muted: #6B7280; --accent: #D97706; } }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; gap: 8px; }
  input { background: var(--surface); color: var(--text); border: 0; border-radius: 999px; padding: 8px 16px; font: inherit; outline: none; }
  input:focus { box-shadow: 0 0 0 2px var(--accent); }
  #grid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, 44px); gap: 4px; align-content: start; }
  #grid img { width: 36px; height: 36px; padding: 4px; border-radius: 12px; cursor: pointer; }
  #grid img:hover { background: var(--surface); }
  #msg { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<input id="q" placeholder="Search server emojis" autocomplete="off">
<div id="grid"></div>
<div id="msg"></div>
<script>
  let all = [];
  const grid = document.getElementById("grid"), msg = document.getElementById("msg"), q = document.getElementById("q");
  function draw() {
    const t = q.value.trim().toLowerCase();
    grid.textContent = "";
    for (const e of all.filter(x => x.name.includes(t))) {
      const i = document.createElement("img");
      i.src = "data:image/png;base64," + e.png; i.title = e.name;
      i.onclick = async () => { if (!(await picker.copy(e.name))) msg.textContent = "Could not copy"; };
      grid.appendChild(i);
    }
    msg.textContent = all.length ? "Click one to copy it, then paste" : "No server emojis. Link a Lodica server first";
  }
  async function load() { q.value = ""; msg.textContent = "Loading server emojis…"; all = (await picker.list()) || []; draw(); q.focus(); }
  q.oninput = draw;
  document.onkeydown = e => { if (e.key === "Escape") window.blur(); };
  picker.onShow(load);
  load();
</script>
</body>
</html>
