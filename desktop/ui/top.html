<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Lodica tabs</title>
<link rel="stylesheet" href="themes.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:color-mix(in srgb,var(--bg) calc(var(--ui-a,1)*100%),transparent)}
body{font:13px/1 system-ui,"Segoe UI",sans-serif;color:var(--mist);user-select:none;display:flex;align-items:center;gap:4px;padding:0 6px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;outline:none}
#tabs{flex:0 1 auto;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.t{flex:0 0 180px;width:180px;min-width:0;height:28px;border-radius:8px;background:var(--raised);display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;cursor:pointer;position:relative}
.t:hover{background:var(--hover2)}
.t.cur{background:var(--high);color:var(--amber);font-weight:600;box-shadow:inset 0 -3px 0 var(--amber),0 0 0 1px color-mix(in srgb,var(--amber) 55%,transparent)}
.t:not(.cur){opacity:.8}
.t.dragging{opacity:.55;transform:scale(.96);box-shadow:0 0 0 2px var(--amber)}
body.tabdrag .t{transition:transform .12s}
.t.drop-before::before,.t.drop-after::after{content:"";position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:2px;background:var(--amber);box-shadow:0 0 6px var(--amber)}
.t.drop-before::before{left:-3px}
.t.drop-after::after{right:-3px}
body.vert .t.drop-before::before,body.vert .t.drop-after::after{left:0;right:0;width:auto;height:3px;top:auto;bottom:auto}
body.vert .t.drop-before::before{top:-3px}
body.vert .t.drop-after::after{bottom:-3px}
.t.priv .l{color:var(--private)}
.t.split{box-shadow:inset 0 -2px var(--amber)}
.t .l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .x{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;font-size:14px}
.t .x:hover{background:var(--hover2);color:var(--mist)}
.add,.mail{height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center}
.add{width:28px;font-size:18px;color:var(--muted)}.add:hover{background:var(--hover);color:var(--mist)}
.mail{margin-left:auto;padding:0 12px;background:var(--amber);color:var(--bg);font-weight:600}
.nav{display:flex;gap:2px;flex:none}
.nb{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mist)}
.nb:hover{background:var(--hover)}
.nb:disabled{opacity:.35;cursor:default;background:none}
.nb svg{width:18px;height:18px;fill:currentColor}
#list{flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:4px}
body.vert{flex-direction:column;align-items:stretch;padding:6px 6px 6px 6px;gap:6px}
body.vert .nav{justify-content:space-between}
body.vert #list{flex:0 1 auto;min-height:0;flex-direction:column;align-items:stretch;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--raised) transparent}
body.vert #tabs{flex-direction:column;overflow:visible;flex:none}
body.vert .t{flex:none;min-width:0;width:100%}
body.vert .add{width:100%;justify-content:flex-start;padding-left:11px}
body.vert .mail{margin:auto 0 0 0;padding:0;height:32px;width:100%}
body.vert.fold{padding:6px 4px;align-items:center}
body.vert.fold .nav{flex-direction:column;align-items:center}
body.vert.fold #list,body.vert.fold #tabs{align-items:center}
body.vert.fold .t{width:34px;padding:0;justify-content:center}
body.vert.fold .t .l{flex:none;text-align:center;overflow:visible;text-overflow:clip;width:1em}
.t .fv{width:16px;height:16px;border-radius:3px;flex:none;object-fit:contain}
.t .fl{width:16px;height:16px;border-radius:4px;flex:none;background:var(--hover2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
body.vert .t{padding-left:9px}
body.vert.fold .t .l{display:none}
body.vert.fold .t{padding:0}
body.vert.fold .t .x{display:none}
body.vert.fold .add{width:34px;padding:0;justify-content:center}
body.vert.fold .mail{font-size:0;width:34px}
body.vert.fold .mail::before{content:"@";font-size:14px}
#grip{position:fixed;top:0;right:0;bottom:0;width:5px;cursor:col-resize}
#grip:hover,#grip.on{background:var(--amber-bg)}
.hidden{display:none!important}
/* update progress: shown while Lodica downloads and installs an update, until it restarts */
#upd{flex:none;display:flex;flex-direction:column;gap:3px;min-width:150px;margin-left:auto;padding:0 8px;font-size:11px;color:var(--muted)}
#upd i{display:block;height:4px;border-radius:2px;background:var(--high);overflow:hidden}
#upd b{display:block;height:100%;width:0;border-radius:2px;background:var(--amber);transition:width .4s ease-out}
#upd.busy b{width:35%!important;animation:updslide 1.2s ease-in-out infinite alternate}
@keyframes updslide{from{margin-left:0}to{margin-left:65%}}
/* page 1: tab strip above the toolbar; the toolbar owns back/forward/reload */
body.bt #back,body.bt #fwd,body.bt #rel{display:none}
body.bt:not(.vert){padding:0 8px;gap:8px;align-items:flex-end;background:var(--bg)}
body.bt:not(.vert) #list{align-items:flex-end;height:100%;padding-top:6px}
body.bt:not(.vert) .t{height:30px;background:transparent;border-radius:12px 12px 0 0;padding:0 6px 0 10px}
body.bt:not(.vert) .t:hover{background:var(--hover)}
body.bt:not(.vert) .t.cur{background:var(--raised);box-shadow:inset 0 3px 0 var(--amber)}
body.bt:not(.vert) .add{height:30px;border-radius:12px}
body.bt .t .fv,body.bt .t .fl{border-radius:4px}
body.bt .t .x{border-radius:999px}

/* Redesign phase 2: sidebar rows, new-tab and private rows, bottom icon row */
.t .x{width:24px;height:24px;border-radius:6px}
body.vert .t{height:34px;background:transparent;border-radius:8px;padding:0 4px 0 8px;font-weight:400;color:var(--mist);box-shadow:none;opacity:1}
body.vert .t:hover{background:var(--hover)}
body.vert .t.cur{background:var(--raised);font-weight:500;box-shadow:0 0 0 1px var(--line)}
body.vert .t.split{box-shadow:inset 0 -2px var(--amber)}
body.vert .t .x{opacity:0;border-radius:6px}
body.vert .t.cur .x,body.vert .t:hover .x{opacity:1}
body.vert .t .fv,body.vert .t .fl{border-radius:4px}
.t.drop-before::before,.t.drop-after::after{box-shadow:none}
.add kbd{font:12px/1 system-ui,"Segoe UI",sans-serif;color:var(--muted);margin-left:auto}
.add .al,.add kbd{display:none}
body.vert .add{height:34px;border-radius:8px;width:100%;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:13px;color:var(--muted);text-align:left}
body.vert .add:hover{background:var(--hover);color:var(--mist)}
body.vert .add .al,body.vert .add kbd{display:inline}
body.vert .add svg,.fb svg{width:16px;height:16px;flex:none}
body.vert #priv{color:var(--private)}
body.vert #priv kbd{display:none}
body.vert #back,body.vert #fwd,body.vert #rel{display:none}
body.vert .nav{justify-content:flex-start}
body.vert #list{flex:1 1 auto}
body.vert #mail{margin:0}
#foot{display:flex;gap:2px;padding-top:6px;border-top:1px solid var(--line)}
#foot .fb{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--muted);cursor:pointer}
#foot .fb:hover{background:var(--hover);color:var(--mist)}
#foot .fb:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
#foot .fb.end{margin-left:auto}
body.vert.fold #foot{flex-direction:column;align-items:center}
body.vert.fold #foot .fb.end{margin-left:0}
body.vert.fold .add{width:34px;padding:0;justify-content:center}
body.vert.fold .add .al,body.vert.fold .add kbd{display:none}
</style>
</head>
<body>
<div class="nav">
<button id="back" class="nb" title="Back (Alt+Left)" disabled></button>
<button id="fwd" class="nb" title="Forward (Alt+Right)" disabled></button>
<button id="rel" class="nb" title="Reload (F5)"></button>
<button id="fold" class="nb hidden" title="Collapse panel"></button>
</div>
<div id="list"><div id="tabs"></div><button id="add" class="add" title="New tab"><span class="al">New tab</span><kbd>Ctrl+T</kbd></button><button id="priv" class="add hidden" title="New private tab"><span class="al">Private tab</span></button></div>
<button id="mail" class="mail hidden" title="Fill the sign-up form with the dummy mail">Use dummy mail</button>
<div id="upd" class="hidden" title="Updating Lodica"><span id="updt"></span><i><b id="updb"></b></i></div>
<div id="foot" class="hidden"></div>
<div id="grip" class="hidden"></div>
<script src="js/boot.js"></script>
<script src="js/customtheme.js"></script>
<script src="js/drag.js"></script>
<script src="js/icons.js"></script>
<script src="js/top.js"></script>
</body>
</html>
