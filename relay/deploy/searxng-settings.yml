# /etc/searxng/settings.yml for Lodica Search. Generate secret_key with: openssl rand -hex 32
# Only the JSON API is used, and only by the relay on 127.0.0.1.
use_default_settings: true
general:
  instance_name: "Lodica Search"
server:
  secret_key: "CHANGE_ME"
  bind_address: "127.0.0.1"
  port: 8888
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"
search:
  safe_search: 0
  formats:
    - json
ui:
  static_use_hash: true
# The default 3 s drops Google, Bing and Brave on a slow VPS, which left only Wikipedia. Give engines longer and retry once.
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  retries: 1
  pool_connections: 100
  pool_maxsize: 20
# Favour engines with large, current indexes over small or stale ones.
engines:
  - name: brave
    disabled: false
    weight: 1.5
  - name: bing
    disabled: false
    weight: 1.3
  - name: google
    disabled: false
    weight: 1.3
  - name: duckduckgo
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: yahoo
    disabled: false
  - name: qwant
    disabled: false
