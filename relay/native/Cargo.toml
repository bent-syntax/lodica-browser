[package]
name = "lodica-relay-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
lodica-core = { path = "../../core", package = "lodica-core" }
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
