name: Lodica
options:
  bundleIdPrefix: be.syntaxya
  deploymentTarget:
    iOS: "16.0"
targets:
  Lodica:
    type: application
    platform: iOS
    sources: [Lodica]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.syntaxya.lodica
        MARKETING_VERSION: "1.15.0"
        CURRENT_PROJECT_VERSION: "221"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lodica
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.0"
