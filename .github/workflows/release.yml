name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key and relay token
        env:
          KEYSTORE_B64: ${{ secrets.LODICA_KEYSTORE }}
          RELAY_TOKEN: ${{ secrets.LODICA_RELAY_TOKEN }}
          LODICA_KEYSTORE_PASS: ${{ secrets.LODICA_KEYSTORE_PASS }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/lodica.jks
          if [ -n "$RELAY_TOKEN" ]; then printf '%s' "$RELAY_TOKEN" > android/keystore/relay-token; fi
          keytool -list -keystore android/keystore/lodica.jks -storepass "$LODICA_KEYSTORE_PASS" -alias lodica > /dev/null \
            || { echo "::error::Keystore does not load: check LODICA_KEYSTORE (base64 -w0 lodica.jks) and LODICA_KEYSTORE_PASS"; exit 1; }
      - name: Build signed release APK
        working-directory: android
        env:
          LODICA_KEYSTORE_PASS: ${{ secrets.LODICA_KEYSTORE_PASS }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/lodica-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: out/*.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            script: dist:linux
          - os: windows-latest
            script: dist
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build installers
        working-directory: desktop
        shell: bash
        env:
          LODICA_API: ${{ secrets.LODICA_API }}
          LODICA_DOMAIN: ${{ secrets.LODICA_DOMAIN }}
          RELAY_TOKEN: ${{ secrets.LODICA_RELAY_TOKEN }}
        run: |
          if [ -n "$RELAY_TOKEN" ]; then printf '%s' "$RELAY_TOKEN" > relay-token; fi
          npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  release:
    needs: [android, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract notes for this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 == "## " v {on=1; next} /^## / {on=0} on' desktop/PATCH_NOTES.md > notes.md
          [ -s notes.md ] || echo "Lodica Browser ${GITHUB_REF_NAME}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
          prerelease: ${{ contains(github.ref_name, '-') }}
