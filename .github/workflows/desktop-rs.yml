name: desktop-rs
on:
  workflow_dispatch:
  push:
    paths: ['desktop-rs/**', 'core/**']
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libnss3 libxss1 libasound2t64 libgbm1
      - run: cargo check --manifest-path desktop-rs/Cargo.toml
