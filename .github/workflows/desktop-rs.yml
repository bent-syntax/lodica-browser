name: desktop-rs
on:
  workflow_dispatch:
  push:
    paths: ['desktop-rs/**', 'core/**', '.github/workflows/desktop-rs.yml']
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libnss3 libxss1 libasound2t64 libgbm1
      # cef-dll-sys fetches the 10.6 MB builds index and trips its own 10 MB limit, so fetch CEF directly.
      - name: Fetch CEF
        run: |
          V='156.0.26%2Bg8ea0c73%2Bchromium-156.0.8078.88'
          mkdir -p "$HOME/cef" && curl -sSL "https://cef-builds.spotifycdn.com/cef_binary_${V}_linux64_minimal.tar.bz2" | tar -xj -C "$HOME/cef" --strip-components=1
          printf '{"type":"minimal","name":"cef_binary_156.0.26+g8ea0c73+chromium-156.0.8078.88_linux64_minimal.tar.bz2","sha1":""}' > "$HOME/cef/archive.json"
          cp -r "$HOME/cef/Release/." "$HOME/cef/" && cp -r "$HOME/cef/Resources/." "$HOME/cef/"
          ls "$HOME/cef"
          echo "CEF_PATH=$HOME/cef" >> "$GITHUB_ENV"
      - run: cargo check --manifest-path desktop-rs/Cargo.toml
